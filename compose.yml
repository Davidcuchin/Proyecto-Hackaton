services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: impulso
      POSTGRES_USER: impulso
      POSTGRES_PASSWORD: impulso_local
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - impulso_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impulso -d impulso"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  impulso_db:
